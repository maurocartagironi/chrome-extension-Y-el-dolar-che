<div>
	<div class="main-content">
		<div class="settings-group">
			<h3 class="group-label">
				{{ getChromeMessage('label_group_badge') }}
			</h3>

			<!-- Badge Exchange Rate -->
			<div class="option-item">
				<label for="badgeExchangeRateType">
					{{ getChromeMessage('label_badge_exchange_rate_opt') }}
					<span class="info-tip" tabindex="0" [attr.data-tip]="getChromeMessage('label_badge_exchange_rate_desc')">ℹ️</span>
				</label>
				@if (picklistCurrency.length > 0) {
					<select
						id="badgeExchangeRateType"
						class="select-currency"
						[ngModel]="badgeExchangeRateType"
						(ngModelChange)="onSelectChange($event)"
					>
						@for (option of picklistCurrency; track option.value) {
							<option [ngValue]="option">
								{{ option.label }}
							</option>
						}
					</select>
				}
			</div>

			<!-- Badge Buy/Sell -->
			<div class="option-item">
				<label for="toggle">
					{{ getChromeMessage('label_badge_buy_sell_opt') }}
					<span class="info-tip" tabindex="0" [attr.data-tip]="getChromeMessage('label_badge_buy_sell_desc')">ℹ️</span>
				</label>
				<div class="toggle-container">
					<input
						type="checkbox"
						id="toggle"
						class="toggle-checkbox"
						[(ngModel)]="badgeIsSell"
						(change)="onCheckSellOrBuy($event)"
					/>
					<label for="toggle" class="toggle-label">
						<span class="toggle-text toggle-text-left">{{ getChromeMessage('result_buy') }}</span>
						<span class="toggle-text toggle-text-right">{{ getChromeMessage('result_sell') }}</span>
					</label>
				</div>
			</div>

			<!-- Badge Color -->
			<div class="option-item">
				<label for="badgeColor">
					{{ getChromeMessage('label_badge_color_opt') }}
					<span class="info-tip" tabindex="0" [attr.data-tip]="getChromeMessage('label_badge_color_desc')">ℹ️</span>
				</label>
				<input
					type="color"
					id="badgeColor"
					class="color-input"
					(change)="setBackgroundColor($event)"
					[(ngModel)]="badgeBackgroundColor"
				/>
			</div>

			<!-- Tooltip Settings -->
			<div class="settings-group">
				<h3 class="group-label">
					{{ getChromeMessage('label_group_tooltip') }}
				</h3>

				<div class="option-item">
					<label for="tooltipExchangeRateType">
						{{ getChromeMessage('label_tooltip_exchange_rate_opt') }}
						<span class="info-tip" tabindex="0" [attr.data-tip]="getChromeMessage('label_tooltip_exchange_rate_desc')">ℹ️</span>
					</label>
					@if (picklistCurrency.length > 0) {
						<select
							id="tooltipExchangeRateType"
							class="select-currency"
							[ngModel]="tooltipExchangeRateType"
							(ngModelChange)="onSelectChangeTooltip($event)"
						>
							@for (option of picklistCurrency; track option.value) {
								<option [ngValue]="option">
									{{ option.label }}
								</option>
							}
						</select>
					}
				</div>
			</div>

			<!-- Conversion Settings -->
			<div class="settings-group">
				<h3 class="group-label">
					{{ getChromeMessage('label_group_conversor') }}
				</h3>
				<div class="option-item">
					<label for="toggleHideConversor">
						{{ getChromeMessage('label_hide_conversor_opt') }}
						<span class="info-tip" tabindex="0" [attr.data-tip]="getChromeMessage('label_hide_conversor_desc')">ℹ️</span>
					</label>
					<div class="toggle-container-hide-conversor">
						<input
							type="checkbox"
							id="toggleHideConversor"
							class="toggle-checkbox"
							(change)="hideQuickConversion($event)"
							[(ngModel)]="quickConversionIsHidden"
						/>
						<label for="toggleHideConversor" class="toggle-label"></label>
					</div>
				</div>
			</div>

			<!-- Tab Settings -->
			<div class="settings-group">
				<h3 class="group-label">
					{{ getChromeMessage('label_group_tab') }}
				</h3>
				<div class="option-item">
					<label for="defaultTab">
						{{ getChromeMessage('label_default_tab_opt') }}
						<span class="info-tip" tabindex="0" [attr.data-tip]="getChromeMessage('label_default_tab_desc')">ℹ️</span>
					</label>
					@if (tabs.length > 0) {
						<select id="defaultTab" class="select-tab" [ngModel]="defaultTab" (ngModelChange)="onSelectTab($event)">
							@for (option of tabs; track option.value) {
								<option [ngValue]="option">
									{{ option.label }}
								</option>
							}
						</select>
					}
				</div>
			</div>

			<!-- Link -->
			<div class="link-container">
				<a href="https://www.buymeacoffee.com/mauropitu" target="_blank" rel="noopener noreferrer">
					<img src="/assets/img/buymeacoffee.png" alt="Buy me a coffee" class="bmac-img" />
				</a>
			</div>
		</div>
	</div>
</div>
