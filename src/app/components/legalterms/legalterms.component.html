@if (isOpen) {
	<div class="modal-overlay" (click)="closeModal()"></div>
}
@if (isOpen) {
	<div class="modal">
		<!-- Botón de cierre (X) -->
		<span class="close-btn" (click)="closeModal()">✖</span>
		<div class="modal-content">
			<h2>{{ getChromeMessage("legal_terms_title") }}</h2>
			<p [innerHTML]="getChromeMessage('legal_terms_text')"></p>
		</div>
	</div>
}
