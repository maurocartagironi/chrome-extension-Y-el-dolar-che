<div class="quick-pricing">
	<div class="calc-row">
		<input
			class="amount-input"
			id="currency-ar"
			type="text"
			inputmode="decimal"
			autocomplete="off"
			[placeholder]="getChromeMessage('conversor_amount_placeholder')"
			[value]="amountText"
			(input)="onAmountInput($any($event.target).value)"
		/>

		<div class="currency-select-row">
			@if (picklistCurrency.length > 0) {
				<select
					class="currency-select flex-1"
					[attr.aria-label]="getChromeMessage('conversor_select')"
					[ngModel]="currencyConversor"
					(ngModelChange)="onSelectChange($event)"
				>
					@for (option of picklistCurrency; track option.value) {
						<option [ngValue]="option">
							{{ option.label }}
						</option>
					}
				</select>
			}
			<button class="icon-btn swap-btn" [title]="getChromeMessage('conversor_swap')" (click)="onCurrencyToggle()">
				<i class="pi pi-arrow-right-arrow-left"></i>
			</button>
		</div>
	</div>

	@if (currencyConversor && config.valueConversor) {
		<div class="result-section">
			<div class="result-label">{{ showTitleResult() }}</div>
			<app-result [compra]="result.get('compra')" [venta]="result.get('venta')"></app-result>
		</div>
	}
</div>
