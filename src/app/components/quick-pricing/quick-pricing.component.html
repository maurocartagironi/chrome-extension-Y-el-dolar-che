<div class="quick-pricing">
	<div class="calc-row">
		<input
			class="amount-input"
			id="currency-ar"
			type="text"
			inputmode="decimal"
			autocomplete="off"
			placeholder="Monto en ARS"
			[value]="amountText"
			(input)="onAmountInput($any($event.target).value)"
		/>

		<div class="currency-select-row">
			<select
				*ngIf="picklistCurrency.length > 0"
				class="currency-select flex-1"
				aria-label="Convertir..."
				[ngModel]="currencyConversor"
				(ngModelChange)="onSelectChange($event)"
			>
				<option *ngFor="let option of picklistCurrency; trackBy: trackByValue" [ngValue]="option">
					{{ option.label }}
				</option>
			</select>
			<button class="icon-btn swap-btn" title="Invertir moneda" (click)="onCurrencyToggle()">
				<i class="pi pi-arrow-right-arrow-left"></i>
			</button>
		</div>
	</div>

	<div class="result-section" *ngIf="currencyConversor && config.valueConversor">
		<div class="result-label">{{ showTitleResult() }}</div>
		<app-result [compra]="result.get('compra')" [venta]="result.get('venta')"></app-result>
	</div>
</div>
