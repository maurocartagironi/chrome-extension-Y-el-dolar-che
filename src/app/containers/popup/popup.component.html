<div id="container">
	<div class="header">
		<div class="logo">
			<img src="/assets/img/logo.png" alt="" />
		</div>
		<div class="buttons">
			<button type="button" (click)="refreshData()" class="btn btn-primary">
				<i class="fas fa-refresh fa-refresh"></i>
			</button>
			<button type="button" class="btn btn-primary">
				<i class="fas fa-gear fa-gear"></i>
			</button>
		</div>
	</div>
	<div class="content">
		<div class="section">
			<div class="table">
				<table>
					<tr *ngFor="let exchangeRate of exchangeRateList">
						<td>{{exchangeRate.nombre}}</td>
						<td>{{exchangeRate.compra}}</td>
						<td>{{exchangeRate.venta}}</td>
					</tr>
				</table>
			</div>
		</div>
		<div class="section">
			<app-quick-pricing [exchangeRateList]="exchangeRateList"></app-quick-pricing>
		</div>
	</div>
	<div class="footer">
		<div>{{lastUpdated}}</div>
		<div>{{realLastUpdated}}</div>
	</div>
</div>
