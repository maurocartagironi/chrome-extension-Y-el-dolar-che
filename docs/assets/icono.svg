<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="¿Y el dólar, che?">
	<defs>
		<!-- El verde del icono original: más claro arriba a la izquierda. -->
		<linearGradient id="fondo" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#38953e" />
			<stop offset="1" stop-color="#2d8938" />
		</linearGradient>
	</defs>

	<circle cx="24" cy="24" r="24" fill="url(#fondo)" />

	<g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
		<!-- La barra vertical, que asoma arriba y abajo de la S. -->
		<path d="M23.9 9.8 V37.4" stroke-width="5.4" />
		<!-- La S: dos panzas unidas por la diagonal del medio. -->
		<path
			d="M30.2 17.8
			   C30.2 14.8 27.3 13.4 24 13.4
			   C20.7 13.4 17.8 14.8 17.8 17.8
			   C17.8 21 20.7 22.2 24 23.2
			   C27.6 24.3 30.4 25.8 30.4 29
			   C30.4 32 27.3 33.6 24 33.6
			   C20.7 33.6 17.6 32.1 17.6 29.2"
			stroke-width="6.2"
		/>
	</g>
</svg>
